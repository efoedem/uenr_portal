{% extends "base.html" %}
{% load static %}
{% block title %}Password Changed | UENR Student Payment Portal{% endblock %}
{% block body %}
<div class="auth-main" style="min-height:100vh">
  <div class="auth-inner">
    <div class="auth-head"><img src="{% static 'img/crest.png' %}" alt="UENR crest" style="width:64px"><h1>UENR</h1></div>
    <div class="auth-card" style="text-align:center">
      <div style="font-size:40px">✅</div>
      <h3>Password updated</h3>
      <p class="muted">You can now log in with your new password.</p>
      <a class="btn btn-primary btn-block" href="{% url 'login' %}">Go to login</a>
    </div>
  </div>
</div>
{% endblock %}
